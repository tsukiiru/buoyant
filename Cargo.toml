[package]
name = "buoyant"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
eframe = "0.35.0"
egui_extras = { version = "0.35.0", features = ["svg"] }
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = "1.0.228"
tokio = { version = "1.52.3", features = ["full", "sync"] }
toml = { version = "1.1.2", features = ["serde"] }
wl-clipboard-rs = "0.9.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = "line-tables-only"
